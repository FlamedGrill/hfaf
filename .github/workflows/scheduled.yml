name: Scheduled task

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification instead of polling"
        type: boolean
        default: false

concurrency:
  group: scheduled-task
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send test notification
        if: ${{ inputs.test }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: curl -fsS -d "Test notification — setup is working." "https://ntfy.sh/$NTFY_TOPIC"

      - uses: actions/setup-python@v5
        if: ${{ !inputs.test }}
        with:
          python-version: '3.12'

      - name: Run
        if: ${{ !inputs.test }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
        run: python poll.py

      - name: Persist state
        if: ${{ !inputs.test }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- state.json; then
            git add state.json
            git commit -m "Update state [skip ci]"
            git push
          else
            echo "No change."
          fi
